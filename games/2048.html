<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 | Tactical Games</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .grid-2048{ display: inline-grid; grid-template-columns: repeat(4, 70px); gap: 10px; background: #111; padding: 10px; border: 2px solid var(--neon-1); margin: 20px auto; }
    .tile{ width: 70px; height: 70px; background: #1a1a1a; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; color: #fff; border-radius: 4px; transition: all 0.15s; }
    .tile.t2{ background: #3d3d3d; color: #fff; }
    .tile.t4{ background: #5a5a5a; color: #fff; }
    .tile.t8{ background: #ff6600; color: #fff; }
    .tile.t16{ background: #ff3333; color: #fff; }
    .tile.t32{ background: #00ff99; color: #000; }
    .tile.t64{ background: #00ffcc; color: #000; }
    .tile.t128{ background: #00ff00; color: #000; font-size: 20px; }
    .tile.t256{ background: #0f0; color: #000; font-size: 20px; }
    .tile.t512{ background: #0f0; color: #000; font-size: 18px; }
    .tile.t1024{ background: #0f0; color: #000; font-size: 16px; }
    .tile.t2048{ background: #ffff00; color: #000; font-weight: bold; box-shadow: 0 0 10px #ffff00; }
    .game-2048-stats{ display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 300px; margin: 20px auto; }
    .stat-box{ background: #0f0f0f; border: 1px solid var(--neon-1); padding: 10px; text-align: center; }
    .stat-label{ color: #666; font-size: 12px; }
    .stat-val{ color: var(--neon-1); font-size: 20px; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="tactical-skull"></div>
    <a href="../index.html" class="nav-link">HOME</a>
    <a href="../missions.html" class="nav-link">MISSIONS</a>
    <a href="tictactoe.html" class="nav-link">TIC-TAC-TOE</a>
    <a href="memory.html" class="nav-link">MEMORY</a>
    <a href="snake.html" class="nav-link">SNAKE</a>
    <a href="2048.html" class="nav-link active">2048</a>
    <button id="mute-btn" class="nav-link mute-btn">🔊 AUDIO</button>
  </nav>

  <main>
    <h1>🎯 2048</h1>
    <p>Merge tiles to reach 2048. Use arrow keys or WASD.</p>
    <div class="game-2048-stats">
      <div class="stat-box">
        <div class="stat-label">SCORE</div>
        <div class="stat-val" id="score-2048">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">BEST</div>
        <div class="stat-val" id="best-2048">0</div>
      </div>
    </div>
    <div class="grid-2048" id="grid-2048"></div>
    <p id="status-2048" style="color: var(--neon-2); margin-top: 15px; font-weight: bold;"></p>
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
      <button id="reset-2048" style="margin-top: 20px;">NEW GAME</button>
      <button id="undo-2048" style="margin-top: 20px; background: #1a1a1a; border: 1px solid var(--neon-2);">↶ UNDO</button>
    </div>
  </main>

  <script src="../js/games-common.js"></script>
  <script>
    let grid, score, best = hget('game2048_best', 0), gameOver = false, history = [];
    const keys = {};

    document.addEventListener('keydown', (e)=>{ keys[e.key.toLowerCase()] = true; handleMove(e); });
    document.addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });

    function initGame(){
      grid = Array(16).fill(0);
      addRandom(); addRandom();
      score = 0; gameOver = false;
      document.getElementById('status-2048').textContent = '';
      document.getElementById('best-2048').textContent = best;
      render();
    }

    function addRandom(){
      const empty = grid.map((v,i)=>v===0?i:-1).filter(i=>i!==-1);
      if(empty.length > 0){
        const idx = empty[Math.floor(Math.random()*empty.length)];
        grid[idx] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function move(dir){
      history.push(JSON.parse(JSON.stringify(grid)));
      let moved = false;
      let newGrid = grid.slice();
      const rotate = (g, times)=>{ for(let i=0;i<times;i++){ const ng=[]; for(let c=0;c<4;c++) for(let r=3;r>=0;r--) ng.push(g[r*4+c]); g=ng; } return g; };
      const compact = (row)=>{ row = row.filter(v=>v!==0); while(row.length<4) row.push(0); return row; };
      const merge = (row)=>{ for(let i=0;i<3;i++) if(row[i]!==0 && row[i]===row[i+1]){ row[i]*=2; score+=row[i]; row.splice(i+1,1); row.push(0); } return row; };
      const process = (row)=>merge(compact(row));
      
      if(dir==='left'||dir==='a') for(let r=0;r<4;r++){ const row = process(grid.slice(r*4,(r+1)*4)); grid.splice(r*4,4,...row); }
      else if(dir==='right'||dir==='d') for(let r=0;r<4;r++){ let row = grid.slice(r*4,(r+1)*4); row.reverse(); row = process(row); row.reverse(); grid.splice(r*4,4,...row); }
      else if(dir==='up'||dir==='w'){
        newGrid = rotate(grid, 3);
        for(let r=0;r<4;r++){ const row = process(newGrid.slice(r*4,(r+1)*4)); newGrid.splice(r*4,4,...row); }
        newGrid = rotate(newGrid, 1);
        grid = newGrid;
      }
      else if(dir==='down'||dir==='s'){
        newGrid = rotate(grid, 1);
        for(let r=0;r<4;r++){ let row = newGrid.slice(r*4,(r+1)*4); row.reverse(); row = process(row); row.reverse(); newGrid.splice(r*4,4,...row); }
        newGrid = rotate(newGrid, 3);
        grid = newGrid;
      }

      if(JSON.stringify(grid) !== JSON.stringify(newGrid)) moved = true;
      if(moved){ addRandom(); if(score > best){ best = score; hset('game2048_best', best); } }
      render();
      if(grid.includes(2048)){ playSound('win'); document.getElementById('status-2048').textContent = '✓ YOU REACHED 2048!'; addXP(500, '2048'); gameOver = true; }
      else if(!canMove()){ playSound('fail'); document.getElementById('status-2048').textContent = '✗ GAME OVER'; gameOver = true; }
    }

    function canMove(){
      for(let i=0;i<16;i++) if(grid[i]===0) return true;
      for(let i=0;i<16;i++){
        const r=Math.floor(i/4), c=i%4;
        if(c<3 && grid[i]===grid[i+1]) return true;
        if(r<3 && grid[i]===grid[i+4]) return true;
      }
      return false;
    }

    function render(){
      const gridEl = document.getElementById('grid-2048');
      gridEl.innerHTML = '';
      grid.forEach(v=>{
        const tile = document.createElement('div');
        tile.className = 'tile';
        if(v > 0) tile.classList.add('t' + v);
        tile.textContent = v || '';
        gridEl.appendChild(tile);
      });
      document.getElementById('score-2048').textContent = score;
    }

    function handleMove(e){
      const key = e.key.toLowerCase();
      if(['arrowleft','a','arrowright','d','arrowup','w','arrowdown','s'].includes(key)){
        e.preventDefault();
        if(!gameOver) move(key.replace('arrow',''));
      }
    }

    document.getElementById('reset-2048').addEventListener('click', initGame);
    document.getElementById('undo-2048').addEventListener('click', ()=>{
      if(history.length > 0 && !gameOver){
        grid = history.pop();
        render();
        playSound('click');
      }
    });
    document.getElementById('mute-btn').addEventListener('click', ()=>{ const muted = toggleMute(); document.getElementById('mute-btn').textContent = muted ? '🔇 MUTED' : '🔊 AUDIO'; });
    initGame();
  </script>
</body>
</html>
