<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player Profile - Ghost</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="overlay"></div>
  <div class="lines-bg" id="lines"></div>

  <nav class="navbar">
    <div class="tactical-skull"></div>
    <a href="index.html" class="nav-link">HOME</a>
    <a href="index.html#games" class="nav-link">ARCADE</a>
    <a href="profile.html" class="nav-link" style="color: var(--neon-2);">PROFILE</a>
    <a href="missions.html" class="nav-link">MISSIONS</a>
    <a href="settings.html" class="nav-link">SETTINGS</a>
    <a href="achievements.html" class="nav-link">ACHIEVEMENTS</a>
    <a href="about.html" class="nav-link">ABOUT</a>
    <button id="muteBtn" class="nav-link mute-btn" aria-label="Toggle sound">🔊</button>
  </nav>

  <main>
    <h1 class="name" style="margin-top: 40px;">PROFILE</h1>
    <p class="tagline">YOUR TACTICAL RECORD</p>

    <!-- Player Stats Card -->
    <div class="profile-header">
      <div class="player-avatar">
        <div class="avatar-circle">
          <span id="player-level" class="level-badge">1</span>
        </div>
      </div>
      <div class="player-info">
        <h2 id="player-name">OPERATOR</h2>
        <p id="player-rank">AGENT</p>
        <div class="rank-bar">
          <div id="rank-fill" class="rank-fill"></div>
        </div>
        <p id="xp-display">0 / 1000 XP</p>
      </div>
    </div>

    <!-- Quick Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🎮</div>
        <div class="stat-value" id="total-games">0</div>
        <div class="stat-label">GAMES PLAYED</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <div class="stat-value" id="total-wins">0</div>
        <div class="stat-label">TOTAL WINS</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-value" id="play-time">0h</div>
        <div class="stat-label">PLAYTIME</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-value" id="streak">0</div>
        <div class="stat-label">WIN STREAK</div>
      </div>
    </div>

    <!-- Badges & Medals Section -->
    <section class="badges-section">
      <h2 style="color: var(--neon-1); margin-bottom: 30px;">BADGES & MEDALS</h2>
      <div class="badges-grid" id="badges-container">
        <!-- Badges will be generated here -->
      </div>
    </section>

    <!-- Game Stats Breakdown -->
    <section class="game-breakdown">
      <h2 style="color: var(--neon-1); margin-bottom: 30px;">GAME STATISTICS</h2>
      <div class="breakdown-grid" id="breakdown-container">
        <!-- Per-game stats will be generated here -->
      </div>
    </section>

    <!-- Recent Sessions -->
    <section class="sessions-section">
      <h2 style="color: var(--neon-1); margin-bottom: 30px;">RECENT SESSIONS</h2>
      <div class="sessions-list" id="sessions-container">
        <!-- Recent games will be listed here -->
      </div>
    </section>

  </main>

  <script src="js/games-common.js"></script>
  <script>
    // Mute button
    document.getElementById('muteBtn').addEventListener('click', () => {
      const muted = window.toggleMute ? window.toggleMute() : false;
      document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
    });

    // Badges Definition
    const badgesList = [
      { id: 'first-play', name: 'First Contact', icon: '🎮', desc: 'Played your first game' },
      { id: 'level-5', name: 'Rising Star', icon: '⭐', desc: 'Reached level 5' },
      { id: 'level-10', name: 'Ace Operator', icon: '🎯', desc: 'Reached level 10' },
      { id: 'level-25', name: 'Legend', icon: '👑', desc: 'Reached level 25' },
      { id: 'streak-10', name: 'On Fire', icon: '🔥', desc: '10 win streak' },
      { id: 'all-games', name: 'Jack of All Trades', icon: '🎭', desc: 'Won all 9 games' },
      { id: 'speedrunner', name: 'Speedrunner', icon: '⚡', desc: 'Won 5 games in one session' },
      { id: 'collector', name: 'Collector', icon: '🏅', desc: 'Unlocked 10+ achievements' }
    ];

    function getPlayerLevel() {
      const xp = window.getXP ? window.getXP() : 0;
      return Math.floor(xp / 1000);
    }

    function getPlayerXP() {
      return (window.getXP ? window.getXP() : 0) % 1000;
    }

    function formatPlaytime(minutes) {
      if(minutes < 60) return minutes + 'm';
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return hours + 'h ' + mins + 'm';
    }

    function renderProfile() {
      const level = getPlayerLevel();
      const xp = getPlayerXP();
      const sessions = JSON.parse(localStorage.getItem('session_history')) || [];
      const gameStats = JSON.parse(localStorage.getItem('game_stats')) || {};
      
      // Update level badge
      document.getElementById('player-level').textContent = level;
      
      // Update rank name based on level
      const rankNames = ['ROOKIE', 'AGENT', 'OPERATIVE', 'SPECIALIST', 'MASTER', 'LEGEND', 'MYTHIC', 'GODLIKE'];
      const rank = rankNames[Math.min(level, rankNames.length - 1)];
      document.getElementById('player-rank').textContent = rank;
      
      // Update XP bar
      document.getElementById('rank-fill').style.width = (xp / 1000 * 100) + '%';
      document.getElementById('xp-display').textContent = xp + ' / 1000 XP to next level';

      // Calculate stats
      let totalGames = 0, totalWins = 0, totalTime = 0;
      const gameWins = {};

      sessions.forEach(session => {
        totalGames++;
        if(session.win) totalWins++;
        totalTime += session.duration || 0;
        if(!gameWins[session.game]) gameWins[session.game] = 0;
        if(session.win) gameWins[session.game]++;
      });

      // Update quick stats
      document.getElementById('total-games').textContent = totalGames;
      document.getElementById('total-wins').textContent = totalWins;
      document.getElementById('play-time').textContent = formatPlaytime(totalTime);
      
      // Calculate streak
      let streak = 0;
      for(let i = sessions.length - 1; i >= 0; i--) {
        if(sessions[i].win) streak++;
        else break;
      }
      document.getElementById('streak').textContent = streak;

      // Render badges
      renderBadges(level, totalWins, streak, gameStats);

      // Render game breakdown
      renderGameBreakdown(gameWins, sessions);

      // Render recent sessions
      renderSessions(sessions.slice(-5).reverse());
    }

    function renderBadges(level, wins, streak, gameStats) {
      const container = document.getElementById('badges-container');
      container.innerHTML = '';

      badgesList.forEach(badge => {
        const earned = checkBadgeEarned(badge.id, level, wins, streak, gameStats);
        const div = document.createElement('div');
        div.className = 'badge ' + (earned ? 'earned' : 'locked');
        div.innerHTML = `
          <div class="badge-icon">${badge.icon}</div>
          <div class="badge-name">${badge.name}</div>
          <div class="badge-desc">${badge.desc}</div>
        `;
        container.appendChild(div);
      });
    }

    function checkBadgeEarned(badgeId, level, wins, streak, gameStats) {
      const earned = JSON.parse(localStorage.getItem('badges_earned')) || [];
      if(earned.includes(badgeId)) return true;

      // Check conditions
      if(badgeId === 'first-play' && wins > 0) return true;
      if(badgeId === 'level-5' && level >= 5) return true;
      if(badgeId === 'level-10' && level >= 10) return true;
      if(badgeId === 'level-25' && level >= 25) return true;
      if(badgeId === 'streak-10' && streak >= 10) return true;
      if(badgeId === 'speedrunner' && wins >= 5) return true;

      return false;
    }

    function renderGameBreakdown(gameWins, sessions) {
      const container = document.getElementById('breakdown-container');
      container.innerHTML = '';

      const games = ['tic-tac-toe', 'memory', 'snake', 'minesweeper', 'flappy', 'pong', '2048', 'breakout', 'hangman'];
      const gameNames = ['Tic-Tac-Toe', 'Memory', 'Snake', 'Minesweeper', 'Flappy', 'Pong', '2048', 'Breakout', 'Hangman'];

      games.forEach((game, idx) => {
        const plays = sessions.filter(s => s.game === game).length;
        const wins = gameWins[game] || 0;
        const winRate = plays > 0 ? Math.round((wins / plays) * 100) : 0;

        const div = document.createElement('div');
        div.className = 'breakdown-card';
        div.innerHTML = `
          <h3>${gameNames[idx]}</h3>
          <div class="breakdown-stat">
            <span>Plays: <strong>${plays}</strong></span>
            <span>Wins: <strong>${wins}</strong></span>
            <span>Win Rate: <strong>${winRate}%</strong></span>
          </div>
          <div class="winrate-bar">
            <div class="winrate-fill" style="width: ${winRate}%"></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderSessions(recentSessions) {
      const container = document.getElementById('sessions-container');
      container.innerHTML = '';

      if(recentSessions.length === 0) {
        container.innerHTML = '<p style="color: #9fd; text-align: center; padding: 20px;">No recent sessions</p>';
        return;
      }

      recentSessions.forEach(session => {
        const date = new Date(session.timestamp);
        const gameNames = { 'tic-tac-toe': 'Tic-Tac-Toe', 'memory': 'Memory', 'snake': 'Snake', 'minesweeper': 'Minesweeper', 'flappy': 'Flappy', 'pong': 'Pong', '2048': '2048', 'breakout': 'Breakout', 'hangman': 'Hangman' };
        
        const div = document.createElement('div');
        div.className = 'session-card ' + (session.win ? 'win' : 'loss');
        div.innerHTML = `
          <div class="session-game">${gameNames[session.game] || session.game}</div>
          <div class="session-result">${session.win ? '✓ WIN' : '✗ LOSS'}</div>
          <div class="session-score">Score: ${session.score || 0}</div>
          <div class="session-date">${date.toLocaleDateString()} ${date.toLocaleTimeString()}</div>
        `;
        container.appendChild(div);
      });
    }

    // Initial render
    renderProfile();

    // Update every 2 seconds
    setInterval(renderProfile, 2000);
  </script>

  <style>
    .profile-header {
      display: flex;
      align-items: center;
      gap: 40px;
      margin: 40px 0 60px;
      padding: 30px;
      background: linear-gradient(135deg, rgba(0, 20, 15, 0.4), rgba(5, 15, 12, 0.2));
      border: 2px solid rgba(0, 255, 170, 0.2);
      border-radius: 16px;
    }

    .player-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(0, 255, 170, 0.3), rgba(0, 255, 170, 0.05));
      border: 3px solid var(--neon-2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.15);
    }

    .level-badge {
      font-size: 3rem;
      font-weight: 900;
      color: var(--neon-2);
      text-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
    }

    .player-info {
      flex-grow: 1;
    }

    .player-info h2 {
      color: var(--neon-2);
      font-size: 2rem;
      margin: 0 0 5px;
    }

    .player-info p {
      color: #a0d8c8;
      margin: 5px 0;
    }

    .rank-bar {
      width: 100%;
      height: 12px;
      background: rgba(0, 255, 170, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 170, 0.2);
      margin: 10px 0;
    }

    .rank-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-2), var(--neon-1));
      transition: width 0.5s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 40px 0 60px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(0, 20, 15, 0.5), rgba(5, 15, 12, 0.3));
      border: 2px solid rgba(0, 255, 170, 0.15);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-8px);
      border-color: rgba(0, 255, 170, 0.35);
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.15);
    }

    .stat-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--neon-2);
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #9fd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badges-section {
      margin: 60px 0;
    }

    .badges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
    }

    .badge {
      background: linear-gradient(135deg, rgba(0, 20, 15, 0.4), rgba(5, 15, 12, 0.2));
      border: 2px solid rgba(0, 255, 170, 0.15);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .badge.earned {
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.15), rgba(0, 200, 150, 0.08));
      border-color: rgba(0, 255, 170, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 170, 0.1);
    }

    .badge.earned:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.2);
    }

    .badge.locked {
      opacity: 0.4;
      filter: grayscale(100%);
    }

    .badge-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .badge-name {
      color: var(--neon-2);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 5px;
    }

    .badge-desc {
      color: #9fd;
      font-size: 0.8rem;
    }

    .game-breakdown {
      margin: 60px 0;
    }

    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .breakdown-card {
      background: linear-gradient(135deg, rgba(0, 20, 15, 0.4), rgba(5, 15, 12, 0.2));
      border: 1px solid rgba(0, 255, 170, 0.15);
      padding: 20px;
      border-radius: 12px;
    }

    .breakdown-card h3 {
      color: var(--neon-2);
      margin: 0 0 15px;
    }

    .breakdown-stat {
      display: flex;
      justify-content: space-around;
      font-size: 0.9rem;
      color: #9fd;
      margin-bottom: 15px;
    }

    .breakdown-stat span {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .breakdown-stat strong {
      color: var(--neon-2);
      font-size: 1.1rem;
      margin-top: 5px;
    }

    .winrate-bar {
      width: 100%;
      height: 8px;
      background: rgba(0, 255, 170, 0.08);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 170, 0.15);
    }

    .winrate-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-1), var(--neon-2));
      transition: width 0.5s ease;
    }

    .sessions-section {
      margin: 60px 0 80px;
    }

    .sessions-list {
      display: grid;
      gap: 12px;
    }

    .session-card {
      background: linear-gradient(135deg, rgba(0, 20, 15, 0.3), rgba(5, 15, 12, 0.15));
      border-left: 4px solid rgba(0, 255, 170, 0.2);
      padding: 15px 20px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 20px;
      align-items: center;
      transition: all 0.2s ease;
    }

    .session-card.win {
      border-left-color: #0f0;
    }

    .session-card.loss {
      border-left-color: #ff3333;
      opacity: 0.7;
    }

    .session-card:hover {
      background: linear-gradient(135deg, rgba(0, 20, 15, 0.5), rgba(5, 15, 12, 0.3));
      transform: translateX(10px);
    }

    .session-game {
      color: var(--neon-2);
      font-weight: 700;
    }

    .session-result {
      color: #0f0;
      font-weight: 900;
    }

    .session-card.loss .session-result {
      color: #ff3333;
    }

    .session-score {
      color: #a0d8c8;
      font-size: 0.95rem;
    }

    .session-date {
      color: #9fd;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .profile-header {
        flex-direction: column;
        gap: 20px;
      }

      .session-card {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</body>
</html>
